x-rabbitmq-env: &rabbitmq-env
  RabbitMq__Host: rabbitmq
  RabbitMq__Port: "5672"
  RabbitMq__VHost: /
  RabbitMq__Username: ${RABBITMQ_USER}
  RabbitMq__Password: ${RABBITMQ_PASSWORD}
  RabbitMq__HeartBeatSeconds: "10"

x-postgres-env: &postgres-env
  Postgres__ConnectionString: Host=postgres;Port=5432;Database=taskflow;Username=taskflow;Password=${POSTGRES_PASSWORD}

services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
      - "5552:5552"
      - "15692:15692"
    volumes:
      - ./deploy/compose/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./deploy/compose/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-taskflow.conf:ro
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - lgtm_data:/data

  rabbitmq-scraper:
    image: otel/opentelemetry-collector-contrib:latest
    command: [ "--config=/etc/otelcol/config.yaml" ]
    volumes:
      - type: bind
        source: ./deploy/compose/otelcol/rabbitmq-scrape.yaml
        target: /etc/otelcol/config.yaml
        read_only: true
    depends_on:
      rabbitmq:
        condition: service_healthy
      lgtm:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  coordinator:
    profiles:
      - "full"
    build:
      context: .
      dockerfile: src/TaskFlow.Coordinator/Dockerfile
    environment:
      <<: [*rabbitmq-env, *postgres-env]
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4317
    ports:
      - "8080-8084:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  worker:
    profiles:
      - "full"
    build:
      context: .
      dockerfile: src/TaskFlow.Worker/Dockerfile
    environment:
      <<: *rabbitmq-env
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4317
    ports:
      - "8090-8099:8080"
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy

  migrator:
    build:
      context: .
      dockerfile: src/TaskFlow.Migrator/Dockerfile
    environment:
      <<: [*rabbitmq-env, *postgres-env]
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4317
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
  rabbitmq_data:
  lgtm_data:
