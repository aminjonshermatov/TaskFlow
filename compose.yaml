services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  coordinator:
    build:
      context: .
      dockerfile: src/TaskFlow.Coordinator/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Container
      ConnectionStrings__TaskFlow: Host=postgres;Port=5432;Database=taskflow;Username=taskflow;Password=${POSTGRES_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: src/TaskFlow.Worker/Dockerfile
    environment:
      TASKFLOW_COORDINATOR_URL: http://coordinator:8081
      TASKFLOW_WORKER_ID: 123
    depends_on:
      - coordinator
    restart: unless-stopped
    
  migrator:
    build:
      context: .
      dockerfile: src/TaskFlow.Migrator/Dockerfile
    environment:
      ConnectionStrings__TaskFlow: Host=postgres;Port=5432;Database=taskflow;Username=taskflow;Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data: