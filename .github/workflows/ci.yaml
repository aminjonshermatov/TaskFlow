name: TaskFlow CI

on:
  pull_request:
  push:
    branches: ["master"]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}


jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          cache: true
          global-json-file: global.json
          cache-dependency-path: '**/packages.lock.json'

      - name: Tool restore
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore --locked-mode

      - name: Format
        run: dotnet format TaskFlow.slnx --no-restore --verify-no-changes

      - name: Build
        run: dotnet build TaskFlow.slnx --no-restore --configuration Release

      - name: Unit Tests
        run: dotnet test --project tests/TaskFlow.UnitTests --no-build -c Release --report-xunit-trx --report-xunit-trx-filename TestResults/unit.trx

      - name: Integration Tests
        run: dotnet test --project tests/TaskFlow.IntegrationTests --no-build -c Release --report-xunit-trx --report-xunit-trx-filename TestResults/integration.trx

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
