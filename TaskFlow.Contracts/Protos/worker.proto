syntax="proto3";

package taskflow.worker.v1;

option csharp_namespace = "TaskFlow.Contracts.Grpc.V1";


service WorkerControl {
  rpc Connect(stream WorkerEvent) returns (stream CoordinatorEvent);
}

message WorkerEvent {
  oneof payload {
    WorkerHello hello = 1;
    WorkerHeartbeat heartbeat = 2;
  }
}

message CoordinatorEvent {
  oneof payload {
    CoordinatorWelcome welcome = 1;
  }
}

message WorkerHello {
  string worker_id = 1;
  string worker_name = 2;
}

message WorkerHeartbeat {
}

message CoordinatorWelcome {
  string coordinator_id = 1;
}
