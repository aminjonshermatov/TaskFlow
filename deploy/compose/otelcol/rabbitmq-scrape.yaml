receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: rabbitmq
          scrape_interval: 15s
          static_configs:
            - targets: ["rabbitmq:15692"]

        - job_name: rabbitmq-queues
          scrape_interval: 15s
          metrics_path: /metrics/detailed
          params:
            family: [queue_coarse_metrics, queue_consumer_count]
          static_configs:
            - targets: ["rabbitmq:15692"]

processors:
  batch: {}

exporters:
  otlp:
    endpoint: lgtm:4317
    tls:
      insecure: true

service:
  pipelines:
    metrics:
      receivers: [prometheus]
      processors: [batch]
      exporters: [otlp]
